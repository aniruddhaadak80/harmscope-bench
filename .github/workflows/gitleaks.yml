name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@b32e38273e77c6da5e7f7fae2f7214d1b9446605 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
