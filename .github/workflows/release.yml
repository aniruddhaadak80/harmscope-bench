name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump kind
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Never cancel a production release partway through.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2c359d55bb9c76643a # v5.4.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bump every manifest
        run: node scripts/release.mjs ${{ inputs.bump }}
      - name: Full gate against the bumped tree
        run: npm run check
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $VERSION" || echo "no version changes"
          git tag -f "$(node -p "require('./package.json').version")"
      - name: Push
        run: git push --follow-tags
